version: '3.8'

services:
  backend:
    build:
      context: ./backend/backend
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - NODE_ENV=production
      - PORT=5002
      - ODOO_URL=${ODOO_URL:-http://localhost:8069}
      - ODOO_DB=${ODOO_DB:-ALFA-ERP}
      - ODOO_USERNAME=${ODOO_USERNAME}
      - ODOO_PASSWORD=${ODOO_PASSWORD}
    volumes:
      - ./backend/backend:/app
      - /app/node_modules
    networks:
      - alfai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://backend:5002
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - alfai-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  alfai-network:
    driver: bridge

volumes:
  backend_data:
  frontend_data:
